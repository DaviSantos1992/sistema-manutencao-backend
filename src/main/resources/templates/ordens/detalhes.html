<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <title>Detalhes da OS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container mt-4">

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0"><i class="bi bi-clipboard-check"></i> Ordem de Serviço #<span th:text="${ordem.id}"></span></h1>
        </div>
        <div class="card-body">
            <p class="mb-1"><strong><i class="bi bi-person"></i> Cliente:</strong> <span th:text="${ordem.clienteNome}"></span></p>
            <p class="mb-1"><strong><i class="bi bi-calendar"></i> Data Abertura:</strong> <span th:text="${ordem.dataAbertura}"></span></p>
            <p class="mb-1" th:if="${ordem.dataConclusao != null}">
                <strong><i class="bi bi-check-circle"></i> Data Conclusão:</strong> <span th:text="${ordem.dataConclusao}"></span>
            </p>
            <p class="mb-1"><strong><i class="bi bi-flag"></i> Status:</strong> <span th:text="${ordem.status}"></span></p>
            <p class="mb-0"><strong><i class="bi bi-currency-dollar"></i> Valor Total:</strong> <span th:text="${ordem.valorTotal}"></span></p>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0"><i class="bi bi-arrow-repeat"></i> Atualizar Status</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/ordens/{id}/status(id=${ordem.id})}" method="post"
                  class="d-flex flex-wrap gap-2 align-items-center">
                <!-- Token CSRF obrigatório para POST com Spring Security -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <select name="status" class="form-select" style="max-width: 260px;" required>
                    <option th:each="st : ${T(com.manutencao.sistema_manutencao.entity.OrdemServico.Status).values()}"
                            th:value="${st}" th:text="${st}" th:selected="${st == ordem.status}"></option>
                </select>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Atualizar</button>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="h5 mb-0"><i class="bi bi-card-text"></i> Descrição do Problema</h2>
        </div>
        <div class="card-body">
            <p class="mb-0" th:text="${ordem.descricaoProblema}"></p>
        </div>
    </div>

    <a class="btn btn-outline-secondary mt-3" th:href="@{/ordens}">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>
</body>
</html>
