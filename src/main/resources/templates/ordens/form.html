<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <title>Nova Ordem de Serviço</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container mt-4" style="max-width: 700px;">

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0"><i class="bi bi-clipboard-plus"></i> Nova Ordem de Serviço</h1>
        </div>
        <div class="card-body">
            <form th:action="@{/ordens}" th:object="${ordemServicoRequest}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Cliente *</label>
                    <select th:field="*{clienteId}" class="form-select" th:errorclass="is-invalid">
                        <option value="">Selecione...</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{clienteId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Descrição do Problema *</label>
                    <textarea th:field="*{descricaoProblema}" class="form-control" rows="3"
                              th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{descricaoProblema}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Serviços *</label>
                    <table class="table table-sm align-middle mb-2">
                        <thead class="table-light">
                        <tr>
                            <th style="width:50px;">Sel.</th>
                            <th>Serviço</th>
                            <th style="width:130px;">Quantidade</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${servicos}">
                            <td>
                                <input type="checkbox" class="form-check-input servico-check"
                                       th:field="*{servicoIds}" th:value="${s.id}">
                            </td>
                            <td th:text="${s.nome}"></td>
                            <td>
                                <input type="number" name="quantidades" class="form-control qtd-input"
                                       value="1" min="1" style="width:110px;" disabled>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('servicoIds')}"
                         th:errors="*{servicoIds}"></div>
                    <div class="form-text">Marque os serviços desejados e informe a quantidade de cada um.</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Criar OS</button>
                    <a class="btn btn-outline-secondary" th:href="@{/ordens}"><i class="bi bi-x-lg"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    document.querySelectorAll('.servico-check').forEach(function (cb) {
        cb.addEventListener('change', function () {
            const qtd = this.closest('tr').querySelector('.qtd-input');
            qtd.disabled = !this.checked;
            if (this.checked && (!qtd.value || parseInt(qtd.value) < 1)) {
                qtd.value = 1;
            }
        });
    });
</script>
</body>
</html>
