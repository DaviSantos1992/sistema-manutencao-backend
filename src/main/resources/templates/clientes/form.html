<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container mt-4" style="max-width: 600px;">

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0" th:text="${isEdicao ? 'Editar Cliente' : 'Novo Cliente'}">
                <i class="bi bi-person-gear"></i> Cliente
            </h1>
        </div>
        <div class="card-body">
            <form th:action="${isEdicao} ? @{/clientes/{id}(id=${clienteId})} : @{/clientes}"
                  th:object="${cliente}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nome *</label>
                    <input type="text" th:field="*{nome}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">E-mail *</label>
                    <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Telefone</label>
                    <input type="text" th:field="*{telefone}" class="form-control">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/clientes}"><i class="bi bi-x-lg"></i> Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
