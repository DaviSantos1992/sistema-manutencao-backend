<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Erro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm text-center" style="max-width: 520px; width: 100%;">
        <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0"><i class="bi bi-exclamation-triangle"></i> Ops! Algo deu errado</h1>
        </div>
        <div class="card-body p-4">
            <div class="display-1 text-primary fw-bold mb-2"
                 th:text="${codigo != null ? codigo : '500'}">500</div>
            <h2 class="h5 mb-3" th:text="${titulo != null ? titulo : 'Erro interno'}">Erro interno</h2>
            <p class="text-muted mb-4"
               th:text="${mensagem != null ? mensagem : 'Ocorreu um erro inesperado. Tente novamente.'}">
                Ocorreu um erro inesperado.
            </p>
            <a class="btn btn-primary" th:href="@{/}">
                <i class="bi bi-house-door"></i> Voltar ao início
            </a>
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()">
                <i class="bi bi-arrow-left"></i> Voltar
            </button>
        </div>
    </div>
</div>
</body>
</html>
