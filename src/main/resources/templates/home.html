<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
  <meta charset="UTF-8">
  <title>Página Inicial</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm mb-4">
  <div class="container">
    <span class="navbar-brand fw-bold"><i class="bi bi-wrench-adjustable-circle"></i> Sistema Manutenção</span>
    <div class="d-flex align-items-center gap-2">
      <span class="text-white">Logado como: <strong th:text="${#authentication.name}"></strong></span>
      <form th:action="@{/preferencias/dark-mode(destino='/')}" method="post" class="mb-0">
        <input type="hidden" name="darkMode" th:value="${!darkMode}">
        <button type="submit" class="btn btn-sm btn-light"
                th:text="${darkMode ? '☀️ Claro' : '🌙 Escuro'}">🌙 Escuro</button>
      </form>
      <form th:action="@{/logout}" method="post" class="mb-0">
        <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Sair</button>
      </form>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="mb-4">Menu Principal</h2>
  <div class="row g-3">
    <div class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/clientes}">
        <div class="card-body text-center py-5">
          <div class="display-3 text-primary mb-3"><i class="bi bi-people-fill"></i></div>
          <h5 class="card-title">Clientes</h5>
          <p class="card-text text-muted mb-0">Cadastro e gestão de clientes</p>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/servicos}">
        <div class="card-body text-center py-5">
          <div class="display-3 text-primary mb-3"><i class="bi bi-tools"></i></div>
          <h5 class="card-title">Serviços</h5>
          <p class="card-text text-muted mb-0">Cadastro e preços de serviços</p>
        </div>
      </a>
    </div>
    <div class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/ordens}">
        <div class="card-body text-center py-5">
          <div class="display-3 text-primary mb-3"><i class="bi bi-clipboard-check"></i></div>
          <h5 class="card-title">Ordens de Serviço</h5>
          <p class="card-text text-muted mb-0">Criação e acompanhamento de OS</p>
        </div>
      </a>
    </div>
    <div sec:authorize="hasRole('ADMIN')" class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/usuarios}">
        <div class="card-body text-center py-5">
          <div class="display-3 text-primary mb-3"><i class="bi bi-person-gear"></i></div>
          <h5 class="card-title">Usuários</h5>
          <p class="card-text text-muted mb-0">Gestão de acesso ao sistema</p>
        </div>
      </a>
    </div>
    <!-- Card Relatório de Faturamento (agora padronizado) -->
    <div sec:authorize="hasRole('ADMIN')" class="col-md-4">
      <a class="card text-decoration-none shadow-sm h-100" th:href="@{/relatorios/faturamento}">
        <div class="card-body text-center py-5">
          <div class="display-3 text-primary mb-3"><i class="bi bi-graph-up-arrow display-4 text-primary"></i></div>
          <h5 class="card-title">Relatório de Faturamento</h5>
          <p class="card-text text-muted mb-0">Faturamento por período</p>
        </div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
