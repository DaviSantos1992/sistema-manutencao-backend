<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <title>Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<div class="container mt-4" style="max-width: 600px;">

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h1 class="h4 mb-0" th:text="${isEdicao ? 'Editar Usuário' : 'Novo Usuário'}">
                <i class="bi bi-person-gear"></i> Usuário
            </h1>
        </div>
        <div class="card-body">

            <!-- ============ FORMULÁRIO DE DADOS (login e perfil) ============ -->
            <form id="formDados"
                  th:action="${isEdicao} ? @{/usuarios/{id}(id=${usuarioId})} : @{/usuarios}"
                  th:object="${usuario}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Login *</label>
                    <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>

                <!-- CRIAÇÃO: senha + confirmação (não aparece na edição) -->
                <div th:if="${!isEdicao}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Senha *</label>
                        <div class="input-group">
                            <input type="password" name="password" id="senhaCriacao" class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="toggleSenha('senhaCriacao', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirmar Senha *</label>
                        <div class="input-group">
                            <input type="password" id="confirmaSenhaCriacao" class="form-control" required>
                            <button type="button" class="btn btn-outline-secondary"
                                    onclick="toggleSenha('confirmaSenhaCriacao', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="text-danger small mt-1" id="msgConfirmaCriacao" style="display:none;">
                            As senhas não conferem.
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Perfil *</label>
                    <select th:field="*{role}" class="form-select" th:errorclass="is-invalid">
                        <option value="ADMIN">ADMIN</option>
                        <option value="TECNICO">TÉCNICO</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{role}"></div>
                </div>

                <!-- ORDEM DOS BOTÕES: Alterar senha | Salvar | Cancelar -->
                <div class="d-flex flex-wrap gap-2">
                    <button th:if="${isEdicao}" type="button" id="btnAlterarSenha"
                            class="btn btn-outline-primary">
                        <i class="bi bi-key"></i> Alterar senha
                    </button>
                    <button type="submit" id="btnSalvar" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Salvar
                    </button>
                    <a class="btn btn-outline-secondary" th:href="@{/usuarios}">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </a>
                </div>
            </form>

            <!-- ============ ÁREA DE ALTERAÇÃO DE SENHA (oculta; só na edição) ============ -->
            <form th:if="${isEdicao}" id="formAlterarSenha"
                  th:action="@{/usuarios/{id}/senha(id=${usuarioId})}" method="post"
                  class="mt-4 border-top pt-3"
                  style="display:none;"
                  th:style="${param.senhaErro != null ? 'display:block;' : 'display:none;'}">

                <h2 class="h5 mb-3"><i class="bi bi-key"></i> Alterar Senha</h2>

                <div th:if="${erroSenha}" class="alert alert-danger" th:text="${erroSenha}"></div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Senha Antiga *</label>
                    <div class="input-group">
                        <input type="password" name="senhaAntiga" id="senhaAntiga" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="toggleSenha('senhaAntiga', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nova Senha *</label>
                    <div class="input-group">
                        <input type="password" name="novaSenha" id="novaSenha" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="toggleSenha('novaSenha', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Confirmar Nova Senha *</label>
                    <div class="input-group">
                        <input type="password" id="confirmaNovaSenha" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary"
                                onclick="toggleSenha('confirmaNovaSenha', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" id="msgConfirmaNova" style="display:none;">
                        As novas senhas não conferem.
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-check-lg"></i> Confirmar alteração
                    </button>
                    <button type="button" id="btnCancelarSenha" class="btn btn-outline-secondary">
                        Cancelar
                    </button>
                </div>
            </form>

        </div>
    </div>

</div>

<script>
    function toggleSenha(idCampo, botao) {
        const campo = document.getElementById(idCampo);
        if (!campo) return;
        const icone = botao.querySelector('i');
        const mostrar = campo.type === 'password';
        campo.type = mostrar ? 'text' : 'password';
        if (icone) {
            icone.classList.toggle('bi-eye', !mostrar);
            icone.classList.toggle('bi-eye-slash', mostrar);
        }
    }

    const btnAlterar = document.getElementById('btnAlterarSenha');
    const formSenha = document.getElementById('formAlterarSenha');
    const btnCancelarSenha = document.getElementById('btnCancelarSenha');
    const btnSalvar = document.getElementById('btnSalvar');

    function mostrarOcultarSenha(mostrar) {
        if (!formSenha) return;
        formSenha.style.display = mostrar ? 'block' : 'none';
        if (btnSalvar) {
            btnSalvar.disabled = mostrar;
        }
        if (mostrar) {
            formSenha.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            const primeiro = formSenha.querySelector('input');
            if (primeiro) primeiro.focus();
        }
    }

    if (btnAlterar) {
        btnAlterar.addEventListener('click', function () {
            const abrir = formSenha.style.display === 'none';
            mostrarOcultarSenha(abrir);
            if (abrir) {
                const msgErro = formSenha.querySelector('.alert-danger');
                if (msgErro) msgErro.style.display = 'none';
            }
        });
    }
    if (btnCancelarSenha) {
        btnCancelarSenha.addEventListener('click', function () {
            mostrarOcultarSenha(false);
        });
    }

    // Se a área veio aberta (?senhaErro=true), o Salvar nasce bloqueado
    if (formSenha && btnSalvar && formSenha.style.display !== 'none') {
        btnSalvar.disabled = true;
    }

    // Validação: criação (senha == confirmação)
    const formDados = document.getElementById('formDados');
    if (formDados) {
        formDados.addEventListener('submit', function (e) {
            const confirma = document.getElementById('confirmaSenhaCriacao');
            if (confirma) {
                const senha = document.getElementById('senhaCriacao').value;
                const msg = document.getElementById('msgConfirmaCriacao');
                if (senha !== confirma.value) {
                    e.preventDefault();
                    msg.style.display = 'block';
                } else {
                    msg.style.display = 'none';
                }
            }
        });
    }

    // Validação: alteração de senha (nova == confirmação)
    if (formSenha) {
        formSenha.addEventListener('submit', function (e) {
            const nova = document.getElementById('novaSenha').value;
            const confirma = document.getElementById('confirmaNovaSenha').value;
            const msg = document.getElementById('msgConfirmaNova');
            if (nova !== confirma) {
                e.preventDefault();
                msg.style.display = 'block';
            } else {
                msg.style.display = 'none';
            }
        });
    }
</script>
</body>
</html>
