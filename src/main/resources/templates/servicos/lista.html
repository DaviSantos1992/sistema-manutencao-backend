<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:attr="data-bs-theme=${darkMode ? 'dark' : 'light'}">
<head>
    <meta charset="UTF-8">
    <title>Serviços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body">
<nav class="navbar navbar-expand-lg bg-primary navbar-dark shadow-sm mb-4">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="bi bi-wrench-adjustable-circle"></i> Sistema Manutenção</span>
        <div class="d-flex align-items-center gap-2">
            <span class="text-white">Logado como: <strong th:text="${#authentication.name}"></strong></span>
            <form th:action="@{/preferencias/dark-mode(destino='/')}" method="post" class="mb-0">
                <input type="hidden" name="darkMode" th:value="${!darkMode}">
                <button type="submit" class="btn btn-sm btn-light"
                        th:text="${darkMode ? '☀️ Claro' : '🌙 Escuro'}">🌙 Escuro</button>
            </form>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Sair</button>
            </form>
        </div>
    </div>
</nav>
<div class="container mt-4">

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0"><i class="bi bi-tools"></i> Serviços</h1>
            <a class="btn btn-light btn-sm" th:href="@{/servicos/novo}">
                <i class="bi bi-plus-lg"></i> Novo Serviço
            </a>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Preço Base</th>
                        <th class="text-end pe-3">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="s : ${servicos}">
                        <td class="ps-3" th:text="${s.id}"></td>
                        <td th:text="${s.nome}"></td>
                        <td th:text="${s.descricao}"></td>
                        <td th:text="${s.precoBase}"></td>
                        <td class="text-end pe-3">
                            <a class="btn btn-sm btn-warning" th:href="@{/servicos/{id}/editar(id=${s.id})}">
                                <i class="bi bi-pencil"></i> Editar
                            </a>
                            <form sec:authorize="hasRole('ADMIN')"
                                  th:action="@{/servicos/{id}/excluir(id=${s.id})}" method="post" style="display:inline"
                                  onsubmit="return confirm('Excluir este serviço?');">
                                <button class="btn btn-sm btn-danger" type="submit">
                                    <i class="bi bi-trash"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a class="btn btn-outline-secondary mt-3" th:href="@{/}">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>
</body>
</html>
