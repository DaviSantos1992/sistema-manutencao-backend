spring.application.name=sistema-manutencao

# Conexão com o banco (lê variáveis de ambiente; usa localhost como padrão)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:sistema_manutencao}?ssl-mode=REQUIRED&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:TrePki92}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate (dialeto é detectado automaticamente no Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Porta do servidor (o Render define a porta via variável PORT)
server.port=${PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:iY5sovmFWW2nbia18uA55H9RLisipjBW}
jwt.expiration=86400000